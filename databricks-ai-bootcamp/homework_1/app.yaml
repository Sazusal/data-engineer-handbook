command:
  - "python"
  - "app.py"

env:
  # Flask configuration for Databricks Apps
  - name: FLASK_RUN_HOST
    value: "0.0.0.0"
  - name: FLASK_RUN_PORT
    value: "8000"

  # Lakebase (Postgres) secret location
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"