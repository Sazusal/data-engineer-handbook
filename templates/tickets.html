<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎫 Support Desk</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #f7f6f3;
      color: #37352f;
      line-height: 1.6;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    /* Sidebar Styles */
    .sidebar {
      width: 280px;
      background: #fbfbfa;
      border-right: 1px solid #e9e9e7;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 24px 16px;
      border-bottom: 1px solid #e9e9e7;
    }
    
    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #37352f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .sidebar-header .meta {
      font-size: 13px;
      color: #787774;
    }
    
    .ticket-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .ticket-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    
    .ticket-item:hover {
      background: rgba(55, 53, 47, 0.08);
    }
    
    .ticket-item.active {
      background: rgba(46, 170, 220, 0.15);
    }
    
    .ticket-item h3 {
      font-size: 14px;
      margin-bottom: 4px;
      font-weight: 500;
      color: #37352f;
    }
    
    .ticket-item .meta {
      font-size: 12px;
      color: #787774;
      margin-bottom: 6px;
    }
    
    .ticket-item .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status.OPEN { 
      background: #e9f3e8; 
      color: #448361; 
    }
    .status.IN_PROGRESS { 
      background: #fdecc8; 
      color: #9f6b00; 
    }
    .status.RESOLVED { 
      background: #d3e5ef; 
      color: #0b6e99; 
    }
    .status.CLOSED { 
      background: #e8deee; 
      color: #6940a5; 
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
    }
    
    .content-header {
      padding: 32px 64px 24px;
      border-bottom: 1px solid #e9e9e7;
    }
    
    .content-header h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #37352f;
      line-height: 1.2;
    }
    
    .ticket-meta {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: #787774;
    }
    
    .ticket-meta div {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Messages */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 64px;
    }
    
    .message {
      margin-bottom: 24px;
      padding: 16px 20px;
      background: #f7f6f3;
      border-radius: 6px;
      border-left: 3px solid #e9e9e7;
    }
    
    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .message-author {
      font-weight: 600;
      font-size: 14px;
      color: #37352f;
    }
    
    .message-time {
      font-size: 12px;
      color: #9b9a97;
    }
    
    .message-text {
      font-size: 14px;
      line-height: 1.7;
      color: #37352f;
    }
    
    /* Status Update Section */
    .status-update {
      padding: 20px 64px;
      border-top: 1px solid #e9e9e7;
      border-bottom: 1px solid #e9e9e7;
      background: #fbfbfa;
    }
    
    .status-update h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #37352f;
    }
    
    .status-controls {
      display: flex;
      gap: 12px;
    }
    
    .status-controls select {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #e9e9e7;
      border-radius: 4px;
      background: white;
      color: #37352f;
      cursor: pointer;
      transition: border 0.15s ease;
    }
    
    .status-controls select:hover {
      border-color: #d3d1cb;
    }
    
    .status-controls select:focus {
      outline: none;
      border-color: #2eaadc;
    }
    
    .status-controls button {
      padding: 8px 24px;
      background: #2eaadc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    
    .status-controls button:hover {
      background: #2b9cc7;
    }
    
    /* Message Form */
    .message-form {
      padding: 20px 64px 32px;
    }
    
    .message-form h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #37352f;
    }
    
    .message-form textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #e9e9e7;
      border-radius: 4px;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
      color: #37352f;
      line-height: 1.6;
      transition: border 0.15s ease;
    }
    
    .message-form textarea:focus {
      outline: none;
      border-color: #2eaadc;
    }
    
    .message-form button {
      margin-top: 12px;
      padding: 10px 24px;
      background: #37352f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    
    .message-form button:hover {
      background: #2f2e29;
    }
    
    /* Create Ticket Button */
    .create-ticket {
      padding: 12px 8px;
      border-top: 1px solid #e9e9e7;
    }
    
    .create-ticket button {
      width: 100%;
      padding: 10px 14px;
      background: #2eaadc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .create-ticket button:hover {
      background: #2b9cc7;
    }
    
    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9b9a97;
      font-size: 15px;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 15, 0.6);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 32px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 16px 70px rgba(0, 0, 0, 0.2);
    }
    
    .modal-content h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #37352f;
    }
    
    .modal-content input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #e9e9e7;
      border-radius: 4px;
      margin-bottom: 20px;
      transition: border 0.15s ease;
    }
    
    .modal-content input:focus {
      outline: none;
      border-color: #2eaadc;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .modal-actions button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    
    .modal-actions .cancel {
      background: #e9e9e7;
      color: #37352f;
    }
    
    .modal-actions .cancel:hover {
      background: #d3d1cb;
    }
    
    .modal-actions .submit {
      background: #2eaadc;
      color: white;
    }
    
    .modal-actions .submit:hover {
      background: #2b9cc7;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(55, 53, 47, 0.16);
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(55, 53, 47, 0.26);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>🎫 Support Desk</h1>
        <div class="meta">All Tickets</div>
      </div>
      <div class="ticket-list" id="ticket-list">
        <div class="empty-state">Loading tickets...</div>
      </div>
      <div class="create-ticket">
        <button onclick="openCreateModal()">➕ Create New Ticket</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <div class="empty-state">Select a ticket to view details</div>
    </div>
  </div>

  <!-- Create Ticket Modal -->
  <div class="modal" id="create-modal">
    <div class="modal-content">
      <h2>Create New Ticket</h2>
      <input type="text" id="new-ticket-title" placeholder="Enter ticket title" />
      <div class="modal-actions">
        <button class="cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="submit" onclick="createTicket()">Create</button>
      </div>
    </div>
  </div>

  <script>
    let tickets = [];
    let selectedTicketId = null;

    async function loadTickets() {
      try {
        const resp = await fetch('/tickets');
        tickets = await resp.json();
        renderTicketList();
        if (tickets.length > 0 && !selectedTicketId) {
          selectTicket(tickets[0].ticket_id);
        }
      } catch (err) {
        console.error('Failed to load tickets:', err);
      }
    }

    function renderTicketList() {
      const listEl = document.getElementById('ticket-list');
      if (tickets.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No tickets yet</div>';
        return;
      }
      listEl.innerHTML = tickets.map(t => `
        <div class="ticket-item ${t.ticket_id === selectedTicketId ? 'active' : ''}" onclick="selectTicket(${t.ticket_id})">
          <h3>#${t.ticket_id} — ${t.title}</h3>
          <div class="meta">Created by ${t.created_by}</div>
          <span class="status ${t.status}">${t.status.replace('_', ' ')}</span>
        </div>
      `).join('');
    }

    async function selectTicket(ticketId) {
      selectedTicketId = ticketId;
      renderTicketList();
      await loadTicketDetails(ticketId);
    }

    async function loadTicketDetails(ticketId) {
      try {
        const [ticket, messages] = await Promise.all([
          fetch(`/tickets/${ticketId}`).then(r => r.json()),
          fetch(`/tickets/${ticketId}/messages`).then(r => r.json())
        ]);

        renderTicketDetails(ticket, messages);
      } catch (err) {
        console.error('Failed to load ticket details:', err);
      }
    }

    function renderTicketDetails(ticket, messages) {
      const mainContent = document.getElementById('main-content');
      mainContent.innerHTML = `
        <div class="content-header">
          <h2>${ticket.title}</h2>
          <div class="ticket-meta">
            <div>📋 Ticket #${ticket.ticket_id}</div>
            <div>👤 ${ticket.created_by}</div>
            <div>📅 ${new Date(ticket.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</div>
          </div>
        </div>

        <div class="status-update">
          <h3>Update Status</h3>
          <div class="status-controls">
            <select id="status-select">
              <option value="OPEN" ${ticket.status === 'OPEN' ? 'selected' : ''}>Open</option>
              <option value="IN_PROGRESS" ${ticket.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
              <option value="RESOLVED" ${ticket.status === 'RESOLVED' ? 'selected' : ''}>Resolved</option>
              <option value="CLOSED" ${ticket.status === 'CLOSED' ? 'selected' : ''}>Closed</option>
            </select>
            <button onclick="updateStatus(${ticket.ticket_id})">Update</button>
          </div>
        </div>

        <div class="messages-container" id="messages">
          ${messages.length === 0 ? '<div class="empty-state">No messages yet</div>' : 
            messages.map(m => `
              <div class="message">
                <div class="message-header">
                  <span class="message-author">${m.author}</span>
                  <span class="message-time">${new Date(m.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div class="message-text">${m.message_text}</div>
              </div>
            `).join('')
          }
        </div>

        <div class="message-form">
          <h3>Add Message</h3>
          <textarea id="message-text" placeholder="Write your response..."></textarea>
          <button onclick="addMessage(${ticket.ticket_id})">Send Message</button>
        </div>
      `;
    }

    async function updateStatus(ticketId) {
      const status = document.getElementById('status-select').value;
      try {
        await fetch(`/tickets/${ticketId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        await loadTickets();
        await loadTicketDetails(ticketId);
      } catch (err) {
        alert('Failed to update status: ' + err);
      }
    }

    async function addMessage(ticketId) {
      const messageText = document.getElementById('message-text').value;
      if (!messageText.trim()) {
        alert('Message cannot be empty');
        return;
      }

      try {
        await fetch(`/tickets/${ticketId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message_text: messageText })
        });
        document.getElementById('message-text').value = '';
        await loadTicketDetails(ticketId);
      } catch (err) {
        alert('Failed to add message: ' + err);
      }
    }

    function openCreateModal() {
      document.getElementById('create-modal').classList.add('show');
      document.getElementById('new-ticket-title').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('show');
      document.getElementById('new-ticket-title').value = '';
    }

    async function createTicket() {
      const title = document.getElementById('new-ticket-title').value;
      if (!title.trim()) {
        alert('Title cannot be empty');
        return;
      }

      try {
        const resp = await fetch('/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await resp.json();
        closeCreateModal();
        await loadTickets();
        selectTicket(data.ticket_id);
      } catch (err) {
        alert('Failed to create ticket: ' + err);
      }
    }

    // Initialize
    loadTickets();
  </script>
</body>
</html>
