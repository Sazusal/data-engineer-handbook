<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎫 Support Desk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .sidebar-header h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .ticket-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .ticket-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .ticket-item:hover {
      background: #f0f0f0;
    }
    .ticket-item.active {
      background: #e3f2fd;
      border-color: #2196f3;
    }
    .ticket-item h3 {
      font-size: 14px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .ticket-item .meta {
      font-size: 12px;
      color: #666;
    }
    .ticket-item .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .status.OPEN { background: #e8f5e9; color: #2e7d32; }
    .status.IN_PROGRESS { background: #fff3e0; color: #ef6c00; }
    .status.RESOLVED { background: #e1f5fe; color: #0277bd; }
    .status.CLOSED { background: #f3e5f5; color: #6a1b9a; }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }
    .content-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .content-header h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .ticket-meta {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: #666;
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .message {
      margin-bottom: 16px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
    }
    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .message-author {
      font-weight: 600;
      font-size: 14px;
    }
    .message-time {
      font-size: 12px;
      color: #999;
    }
    .message-text {
      font-size: 14px;
      line-height: 1.5;
    }
    .status-update {
      padding: 20px;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
    }
    .status-update h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .status-controls {
      display: flex;
      gap: 12px;
    }
    .status-controls select {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .status-controls button {
      padding: 8px 24px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .status-controls button:hover {
      background: #1976d2;
    }
    .message-form {
      padding: 20px;
      border-top: 1px solid #e0e0e0;
    }
    .message-form h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .message-form textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }
    .message-form button {
      margin-top: 12px;
      padding: 10px 24px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .message-form button:hover {
      background: #45a049;
    }
    .create-ticket {
      padding: 12px;
      border-top: 1px solid #e0e0e0;
    }
    .create-ticket button {
      width: 100%;
      padding: 10px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .create-ticket button:hover {
      background: #1976d2;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 16px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
    }
    .modal-content h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .modal-actions button {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .modal-actions .cancel {
      background: #e0e0e0;
      color: #333;
    }
    .modal-actions .submit {
      background: #2196f3;
      color: white;
    }
    .error {
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 4px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>🎫 Support Desk</h1>
        <div class="meta">All Tickets</div>
      </div>
      <div class="ticket-list" id="ticket-list">
        <div class="empty-state">Loading tickets...</div>
      </div>
      <div class="create-ticket">
        <button onclick="openCreateModal()">➕ Create New Ticket</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <div class="empty-state">Select a ticket to view details</div>
    </div>
  </div>

  <!-- Create Ticket Modal -->
  <div class="modal" id="create-modal">
    <div class="modal-content">
      <h2>Create New Ticket</h2>
      <input type="text" id="new-ticket-title" placeholder="Enter ticket title" />
      <div class="modal-actions">
        <button class="cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="submit" onclick="createTicket()">Create</button>
      </div>
    </div>
  </div>

  <script>
    let tickets = [];
    let selectedTicketId = null;

    async function loadTickets() {
      try {
        const resp = await fetch('/tickets');
        tickets = await resp.json();
        renderTicketList();
        if (tickets.length > 0 && !selectedTicketId) {
          selectTicket(tickets[0].ticket_id);
        }
      } catch (err) {
        console.error('Failed to load tickets:', err);
      }
    }

    function renderTicketList() {
      const listEl = document.getElementById('ticket-list');
      if (tickets.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No tickets yet</div>';
        return;
      }
      listEl.innerHTML = tickets.map(t => `
        <div class="ticket-item ${t.ticket_id === selectedTicketId ? 'active' : ''}" onclick="selectTicket(${t.ticket_id})">
          <h3>#${t.ticket_id} — ${t.title}</h3>
          <div class="meta">Created by ${t.created_by}</div>
          <span class="status ${t.status}">${t.status}</span>
        </div>
      `).join('');
    }

    async function selectTicket(ticketId) {
      selectedTicketId = ticketId;
      renderTicketList();
      await loadTicketDetails(ticketId);
    }

    async function loadTicketDetails(ticketId) {
      try {
        const [ticket, messages] = await Promise.all([
          fetch(`/tickets/${ticketId}`).then(r => r.json()),
          fetch(`/tickets/${ticketId}/messages`).then(r => r.json())
        ]);

        renderTicketDetails(ticket, messages);
      } catch (err) {
        console.error('Failed to load ticket details:', err);
      }
    }

    function renderTicketDetails(ticket, messages) {
      const mainContent = document.getElementById('main-content');
      mainContent.innerHTML = `
        <div class="content-header">
          <h2>${ticket.title}</h2>
          <div class="ticket-meta">
            <div>Ticket #${ticket.ticket_id}</div>
            <div>Created by ${ticket.created_by}</div>
            <div>${new Date(ticket.created_at).toLocaleString()}</div>
          </div>
        </div>

        <div class="status-update">
          <h3>Update Status</h3>
          <div class="status-controls">
            <select id="status-select">
              <option value="OPEN" ${ticket.status === 'OPEN' ? 'selected' : ''}>Open</option>
              <option value="IN_PROGRESS" ${ticket.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
              <option value="RESOLVED" ${ticket.status === 'RESOLVED' ? 'selected' : ''}>Resolved</option>
              <option value="CLOSED" ${ticket.status === 'CLOSED' ? 'selected' : ''}>Closed</option>
            </select>
            <button onclick="updateStatus(${ticket.ticket_id})">Update</button>
          </div>
        </div>

        <div class="messages-container" id="messages">
          ${messages.length === 0 ? '<div class="empty-state">No messages yet</div>' : 
            messages.map(m => `
              <div class="message">
                <div class="message-header">
                  <span class="message-author">${m.author}</span>
                  <span class="message-time">${new Date(m.created_at).toLocaleString()}</span>
                </div>
                <div class="message-text">${m.message_text}</div>
              </div>
            `).join('')
          }
        </div>

        <div class="message-form">
          <h3>Add Message</h3>
          <textarea id="message-text" placeholder="Write your response..."></textarea>
          <button onclick="addMessage(${ticket.ticket_id})">Send Message</button>
        </div>
      `;
    }

    async function updateStatus(ticketId) {
      const status = document.getElementById('status-select').value;
      try {
        await fetch(`/tickets/${ticketId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        await loadTickets();
        await loadTicketDetails(ticketId);
      } catch (err) {
        alert('Failed to update status: ' + err);
      }
    }

    async function addMessage(ticketId) {
      const messageText = document.getElementById('message-text').value;
      if (!messageText.trim()) {
        alert('Message cannot be empty');
        return;
      }

      try {
        await fetch(`/tickets/${ticketId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message_text: messageText })
        });
        document.getElementById('message-text').value = '';
        await loadTicketDetails(ticketId);
      } catch (err) {
        alert('Failed to add message: ' + err);
      }
    }

    function openCreateModal() {
      document.getElementById('create-modal').classList.add('show');
      document.getElementById('new-ticket-title').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('show');
      document.getElementById('new-ticket-title').value = '';
    }

    async function createTicket() {
      const title = document.getElementById('new-ticket-title').value;
      if (!title.trim()) {
        alert('Title cannot be empty');
        return;
      }

      try {
        const resp = await fetch('/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await resp.json();
        closeCreateModal();
        await loadTickets();
        selectTicket(data.ticket_id);
      } catch (err) {
        alert('Failed to create ticket: ' + err);
      }
    }

    // Initialize
    loadTickets();
  </script>
</body>
</html>
